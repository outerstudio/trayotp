name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: |
          Scripts/fetch-test-fixtures.sh
          swift run -c release OTPCoreTests
      - name: Build app
        run: CONFIG=release Scripts/bundle.sh

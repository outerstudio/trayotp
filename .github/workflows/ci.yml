name: CI

# Runs the tests and builds the app on every push to main and every pull request.
# The built app is attached to the run as an artifact, so any commit can be tried without building it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # bundle.sh uses the commit count as the build number

      - name: Tests
        run: |
          Scripts/fetch-test-fixtures.sh
          swift run -c release OTPCoreTests

      - name: Build universal app
        run: |
          CONFIG=release UNIVERSAL=1 Scripts/bundle.sh
          ditto -c -k --keepParent build/TrayOTP.app TrayOTP.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: TrayOTP-${{ github.sha }}
          path: TrayOTP.zip
          retention-days: 14

name: CI

# Runs the tests on every pull request. Building and publishing the app is done by release.yml.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: |
          Scripts/fetch-test-fixtures.sh
          swift run -c release OTPCoreTests

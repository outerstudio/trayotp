name: Release

# Push a tag like v0.1.0 to build a universal (Apple silicon + Intel) app and publish it.
# Builds are ad-hoc signed with the hardened runtime (no Apple Developer certificate), so
# macOS asks users to approve the app once: see "Install" in the README.

on:
  push:
    # vX.Y.Z or a pre-release like vX.Y.Z-beta.1: the tag becomes CFBundleShortVersionString and
    # is what the in-app updater compares. Pre-releases are published as GitHub pre-releases,
    # which the updater only offers on its beta and alpha channels.
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: write
  # Read by the release notes, to thank contributors and issue reporters.
  issues: read
  pull-requests: read

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tests
        run: |
          Scripts/fetch-test-fixtures.sh
          swift run -c release OTPCoreTests

      - name: Build universal app
        run: |
          VERSION="${GITHUB_REF_NAME#v}" CONFIG=release UNIVERSAL=1 Scripts/bundle.sh
          ditto -c -k --keepParent build/TrayOTP.app "TrayOTP-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "TrayOTP-${GITHUB_REF_NAME}.zip" > "TrayOTP-${GITHUB_REF_NAME}.zip.sha256"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # User-facing changes only (feat, fix, perf, revert) from the Conventional Commits since the
      # previous tag; a stable release also includes what its betas shipped. Outside contributors
      # and the reporters of closed issues are thanked. See Scripts/changelog.
      #
      # An annotated tag's message (minus its subject line) is a hand-written intro shown above the
      # generated list. Create it with `git tag -a vX.Y.Z -F notes.md --cleanup=verbatim` so Markdown
      # headings starting with # survive.
      - name: Release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # actions/checkout turns the tag that triggered the run into a lightweight one, which drops
          # its message; fetch it again to get the annotated tag back.
          git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          npm ci --prefix Scripts/changelog
          node Scripts/changelog/changelog.mjs notes "$GITHUB_REF_NAME" > release-notes.md
          cat release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && PRERELEASE=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            "TrayOTP-${GITHUB_REF_NAME}.zip" "TrayOTP-${GITHUB_REF_NAME}.zip.sha256" \
            --notes-file release-notes.md "${PRERELEASE[@]}"

      # Rewrite CHANGELOG.md on main now that the tag exists. Stable releases only: pre-releases are
      # listed on the Releases page, not in the file. Skipped when nothing changed.
      - name: Update CHANGELOG.md
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          node Scripts/changelog/changelog.mjs file
          if git diff --quiet CHANGELOG.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update CHANGELOG.md for ${GITHUB_REF_NAME}" CHANGELOG.md
          git push origin main

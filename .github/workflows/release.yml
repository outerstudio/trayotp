name: Release

# Push a tag like v0.1.0 to build a universal (Apple silicon + Intel) app and publish it.
# Builds are ad-hoc signed with the hardened runtime (no Apple Developer certificate), so
# macOS asks users to approve the app once: see "Install" in the README.

on:
  push:
    # Only vX.Y.Z (no pre-release suffix): the tag becomes CFBundleShortVersionString and is
    # what the in-app updater compares. Other tags, like v1.0.0-beta, don't start a run.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tests
        run: |
          Scripts/fetch-test-fixtures.sh
          swift run -c release OTPCoreTests

      - name: Build universal app
        run: |
          VERSION="${GITHUB_REF_NAME#v}" CONFIG=release UNIVERSAL=1 Scripts/bundle.sh
          ditto -c -k --keepParent build/TrayOTP.app "TrayOTP-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "TrayOTP-${GITHUB_REF_NAME}.zip" > "TrayOTP-${GITHUB_REF_NAME}.zip.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "TrayOTP-${GITHUB_REF_NAME}.zip" "TrayOTP-${GITHUB_REF_NAME}.zip.sha256" \
            --generate-notes
